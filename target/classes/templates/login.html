<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>登录</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 40px; }
    .box { max-width: 360px; margin: 0 auto; border: 1px solid #eee; padding: 24px; border-radius: 8px; }
    .title { font-size: 20px; margin-bottom: 16px; }
    label { display: block; margin: 8px 0 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 8px; box-sizing: border-box; }
    .btn { margin-top: 16px; width: 100%; padding: 10px; background: #1677ff; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .msg { color: #d33; margin: 8px 0; min-height: 20px; }
    .tip { font-size: 12px; color: #666; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">系统登录</div>

    <div class="msg" th:if="${param.error}">用户名或密码错误</div>
    <div class="msg" th:if="${param.logout}">您已退出登录</div>

    <form th:action="@{/login}" method="post">
      <label>用户名</label>
      <input name="username" type="text" autocomplete="username" required />

      <label>密码</label>
      <input name="password" type="password" autocomplete="current-password" required />

      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <button class="btn" type="submit">登录</button>
    </form>

    <div class="tip">测试账号：admin / admin123 或 user / user123</div>
  </div>
</body>
</html>
