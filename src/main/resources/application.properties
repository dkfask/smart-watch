spring.application.name=demo2
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# 服务器端口配置
server.port=8080
app.tcp.port=9090
app.mpband.port=9000
app.mpband.saveDir=.


# Database configuration - remote (default)
spring.datasource.url=${DB_URL:jdbc:mysql://8.156.83.206:3306/smart_watch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:remote_lei}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Configuration (optimized for remote DB)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=SmartWatchHikariPool

# Set active profile (uncomment one of the following lines to switch database)
# spring.profiles.active=local

# Local database configuration will be in application-local.properties


spring.sql.init.mode=never

# Add Hibernate dialect configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Enable JPA to automatically create/update tables
spring.jpa.hibernate.ddl-auto=update
# Disable foreign key constraints generation (MySQL partition tables don't support foreign keys)
spring.jpa.properties.hibernate.hbm2ddl.foreign_key_constraints=disable
spring.jpa.properties.hibernate.foreign_keys=disable
# Additional Hibernate 6.x configuration to disable foreign keys
spring.jpa.properties.jakarta.persistence.schema-generation.create-database-schemas=false
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none
# Disable foreign key creation for MySQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Disable foreign key constraints for schema generation
spring.jpa.properties.hibernate.schema-generation-foreign-key-constraints=none

# Thymeleaf configuration for resilience
spring.thymeleaf.check-template=false
spring.thymeleaf.check-template-location=false

spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

app.spa.enabled=true


app.mpband.useDelimiterReader=true

app.mpband.frameDelimiter=#

app.mpband.appendNewlineAfterResponse=false

app.mpband.soTimeoutMillis=18000000

app.mpband.maxFrameLength=4096

# ------------------ Location retention ------------------

app.location.retentionDays=30

app.mpband.responseKey=${MPBAND_RESPONSE_KEY:}

amap.web.key=${AMAP_WEB_KEY:}

# Redis配置（空密码仅用于本地开发，生产环境请设置 SPRING_REDIS_PASSWORD 环境变量）
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.redis.timeout=30000
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-wait=-1
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0

server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/xml,text/javascript
server.compression.min-response-size=1024

# Flyway 数据库迁移配置
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.encoding=UTF-8
spring.flyway.validate-on-migrate=true
