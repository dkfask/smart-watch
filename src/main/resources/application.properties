# Set active profile (uncomment one of the following lines to switch database)
# spring.profiles.active=local

# Local database configuration will be in application-local.properties


spring.sql.init.mode=never

# Add Hibernate dialect configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Enable JPA to automatically create/update tables
spring.jpa.hibernate.ddl-auto=update
# Disable foreign key constraints generation (MySQL partition tables don't support foreign keys)
spring.jpa.properties.hibernate.hbm2ddl.foreign_key_constraints=disable
spring.jpa.properties.hibernate.foreign_keys=disable
# Additional Hibernate 6.x configuration to disable foreign keys
spring.jpa.properties.jakarta.persistence.schema-generation.create-database-schemas=false
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none
# Disable foreign key creation for MySQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# Disable foreign key constraints for schema generation
spring.jpa.properties.hibernate.schema-generation-foreign-key-constraints=none

# Thymeleaf configuration for resilience
spring.thymeleaf.check-template=false
spring.thymeleaf.check-template-location=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

app.spa.enabled=true


app.mpband.useDelimiterReader=true

app.mpband.frameDelimiter=#

app.mpband.appendNewlineAfterResponse=false

app.mpband.soTimeoutMillis=18000000

app.mpband.maxFrameLength=64

