# Container-only overrides — activated via SPRING_PROFILES_ACTIVE=docker.
#
# Why a separate profile rather than editing application.properties:
# - Local development (gradlew bootRun) continues to use the dev defaults,
#   including JPA ddl-auto=update against the local MySQL instance.
# - Production / container deployments use this profile so that the schema is
#   managed exclusively by the SQL files in /docker-entrypoint-initdb.d/, not
#   by Hibernate. This avoids the documented mismatches between JPA entities
#   and the hand-written schema (Alarm entity vs device_alert table, etc.).
#
# Properties NOT overridden here (kept from application.properties):
#   - DB_URL / DB_USERNAME / DB_PASSWORD (env vars injected via docker-compose)
#   - server.port, app.mpband.port, app.tcp.port (env vars via Spring relaxed binding)
#   - security, JWT, Amap settings
#   - Hikari pool defaults (overridden below for container sizing)

# ---------------------------------------------------------------------------
# Schema management
# ---------------------------------------------------------------------------
# SQL files mounted into MySQL's /docker-entrypoint-initdb.d/ own the schema.
# JPA must NOT attempt to modify it; otherwise duplicate indexes / columns
# appear and the app crashes on startup.
spring.jpa.hibernate.ddl-auto=none

# ---------------------------------------------------------------------------
# Health endpoint (required for the Docker HEALTHCHECK)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Device log persistence
# ---------------------------------------------------------------------------
# MpbandServer writes raw frames and per-device daily logs to {saveDir}/raw
# and {saveDir}/devices. In dev this is "." (CWD); in containers we point at
# the mounted named volume so data survives container restarts.
app.mpband.saveDir=${APP_MPBAND_SAVEDIR:/app/mpband_data}

# ---------------------------------------------------------------------------
# Container-friendly Hikari sizing
# ---------------------------------------------------------------------------
# The default pool (20 max) was sized for a remote DB used by many clients.
# Inside the compose network, only the app connects to MySQL — a smaller pool
# keeps MySQL's max_connections budget healthy.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ---------------------------------------------------------------------------
# Graceful shutdown
# ---------------------------------------------------------------------------
# SIGTERM (sent by `docker stop`) used to kill the JVM mid-Hikari-flush /
# mid-Netty-write. Without this, in-flight mpband frames and scheduled jobs
# die abruptly. With it, Spring drains HTTP requests for up to 30 s, Netty
# closes channels cleanly, and Hikari returns pooled connections.
#
# IMPORTANT: docker-compose.yml's `stop_grace_period: 35s` MUST stay > this
# value, otherwise docker sends SIGKILL before the JVM finishes draining.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
