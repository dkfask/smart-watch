# ============================================================================
# Smart Watch Monitoring System — local compose stack
# ============================================================================
# Two services:
#   - mysql : official MySQL 8.0 with the project schema baked in via
#             /docker-entrypoint-initdb.d/. Data persisted in the
#             `mysql_data` named volume.
#   - app   : the Spring Boot jar built from this repo's Dockerfile, exposing
#             8080 (HTTP+UI), 9000 (Netty device comms), and 9090 (TCP echo).
#
# Usage:
#   cp .env.docker .env       # then edit secrets
#   docker compose build
#   docker compose up -d
#   docker compose ps         # wait until both services report `healthy`
#   open http://localhost:8080
# ============================================================================

name: smart-watch

services:

  # -------------------------------------------------------------------------
  # MySQL 8 — schema source of truth (init SQL baked into the app image)
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: smart-watch-mysql
    restart: unless-stopped
    command:
      - "--default-time-zone=+08:00"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_watch}
      MYSQL_USER: ${MYSQL_USER:-smart_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smart123}
      TZ: Asia/Shanghai
    ports:
      # Exposed on the host for ad-hoc inspection (DBeaver, mysql CLI, etc.).
      # Comment out if you don't want MySQL reachable from the host.
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      # Persistent database files (survives `docker compose down`).
      - mysql_data:/var/lib/mysql
      # Server-level config (event_scheduler, time zone, charset).
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test:
        - "CMD"
        - "mysqladmin"
        - "ping"
        - "-h"
        - "127.0.0.1"
        - "-uroot"
        - "-p${MYSQL_ROOT_PASSWORD:-rootpass_change_me}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - smart_net

  # -------------------------------------------------------------------------
  # Application — Spring Boot + embedded Vue SPA
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-watch:local
    container_name: smart-watch-app
    restart: unless-stopped
    # SIGTERM grace period — must be > spring.lifecycle.timeout-per-shutdown-phase
    # (30s, set in application-docker.properties) so the JVM can drain HTTP
    # requests and close Netty channels cleanly before docker sends SIGKILL.
    stop_grace_period: 35s
    stop_signal: SIGTERM
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Spring profile activates src/main/resources/application-docker.properties
      # (ddl-auto=none, actuator exposure, mpband saveDir override).
      SPRING_PROFILES_ACTIVE: docker

      # Database connection — `mysql` is the compose service hostname.
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart_watch}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8"
      DB_USERNAME: ${MYSQL_USER:-smart_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-smart123}

      # Netty device port (9000) — Spring relaxed binding reads APP_MPBAND_PORT
      # into @Value("${app.mpband.port}"). Same for the echo TCP port (9090).
      APP_MPBAND_PORT: ${APP_MPBAND_PORT:-9000}
      APP_TCP_PORT: ${APP_TCP_PORT:-9090}
      APP_MPBAND_SAVEDIR: /app/mpband_data

      # Third-party / device secrets.
      AMAP_WEB_KEY: ${AMAP_WEB_KEY:-}
      MPBAND_RESPONSE_KEY: ${MPBAND_RESPONSE_KEY:-}

      # Redis cache stays off by default; flip to true and add a redis service
      # to docker-compose.yml if you want caching.
      APP_CACHE_REDIS_ENABLED: "false"

      TZ: Asia/Shanghai

      # Extra JVM flags appended to JAVA_TOOL_OPTIONS baked into the image.
      JAVA_OPTS: >-
        -Duser.timezone=Asia/Shanghai
        -Dfile.encoding=UTF-8
    ports:
      - "${APP_HTTP_PORT:-8080}:8080"
      - "${APP_MPBAND_PORT:-9000}:9000"
      - "${APP_TCP_PORT:-9090}:9090"
    volumes:
      # Device raw frames and per-device logs survive container restarts.
      - mpband_data:/app/mpband_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    networks:
      - smart_net

volumes:
  mysql_data:
  mpband_data:

networks:
  smart_net:
    driver: bridge
