plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'demo2'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// Note: mavenCentral() is intentionally OMITTED because it is
	// unreachable from many mainland-China networks. When Gradle hits a
	// timeout it disables ALL repositories for the failing module, then
	// falls back to Maven Central — which times out again, causing a
	// silent build failure. Using only the Aliyun + Huawei mirrors keeps
	// resolution deterministic.
	maven { url 'https://maven.aliyun.com/repository/public' }
	maven { url 'https://maven.aliyun.com/repository/spring' }
	maven { url 'https://maven.aliyun.com/repository/spring-plugin' }
	maven { url 'https://repo.huaweicloud.com/repository/maven/' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'io.micrometer:micrometer-core'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'mysql:mysql-connector-java:8.0.33'
	runtimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'com.google.guava:guava:32.1.3-jre'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

compileJava.options.fork = false

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

bootJar {
	archiveFileName = 'demo2.jar'
}

tasks.register('npmBuild') {
    group = 'build'
    description = 'Build frontend using npm (Vite)'
    doLast {
        // 支持通过 Gradle 属性 skipFrontend=true 跳过前端构建（CI 或无 Node 环境时非常有用）
        if (project.hasProperty('skipFrontend') && project.property('skipFrontend') == 'true') {
            println 'skipFrontend=true，跳过前端构建'
            return
        }
        def frontendDir = file("${projectDir}/frontend")
        if (!frontendDir.exists()) {
            println "frontend 目录不存在，跳过前端构建"
            return
        }
        println 'Running npm install and npm run build in frontend...'
        if (org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)) {
            exec {
                workingDir frontendDir
                // 在 Windows 上分别执行两次 exec，避免 shell 链接导致 Gradle 在 settings 阶段误判子目录为另一个构建
                commandLine 'cmd', '/c', 'npm', 'install'
            }
            exec {
                workingDir frontendDir
                commandLine 'cmd', '/c', 'npm', 'run', 'build'
            }
        } else {
            exec {
                workingDir frontendDir
                // Unix-like 系统上也分别执行两次命令以更稳健
                commandLine 'sh', '-c', 'npm install'
             }
            exec {
                workingDir frontendDir
                commandLine 'sh', '-c', 'npm run build'
            }
        }
    }
}

tasks.register('copyFrontendDist') {
    group = 'build'
    description = 'Copy frontend/dist to src/main/resources/static'
    dependsOn tasks.named('npmBuild')
    doLast {
        def distDir = file("${projectDir}/frontend/dist")
        def targetDir = file("${projectDir}/src/main/resources/static")
        if (!distDir.exists()) {
            println "frontend/dist 不存在，跳过复制"
            return
        }
        println "Copying frontend/dist to ${targetDir} ..."
        copy {
            from distDir
            into targetDir
        }
    }
}

tasks.named('bootJar') {
    dependsOn tasks.named('copyFrontendDist')
}
